# Every tunable for mejoint lives here. A copy (and its hash) is written into every output folder.
# Values marked "from CLAUDE.md" are the brief's defaults; change them here, never in code.

project_seed: 20261102        # root of all SeedSequence-derived seeds (CLAUDE.md section 12)

acquisition:
  te_ms: [16.20, 31.22, 46.24, 61.26]   # from CLAUDE.md section 4; Phase 0 confirms against JSON
  te_tolerance_ms: 0.05                  # a JSON TE further than this from te_ms is flagged
  expected_matrix: [52, 64, 48]
  tr_s: 0.75
  voxel_mm: [3.281, 3.281, 3.3]          # confirmed in Phase 0 (all runs)
  mb_factor: 6                           # derived from SliceTiming (not in the JSON)
  slice_stack_separation: 8              # slices acquired together are 8 apart (48 / 6)
  phase_encoding: i                      # left-right; CAIPI shift unknown

subjects:
  exclude:                               # user decision 2026-11-02
    "P08": "267-278 volumes per echo; volume pairing failed in mbme_tedana"

inventory:                    # Phase 0 audit
  search_depth: 1             # NIfTI/DICOM may sit in the NIfTI folder or one level deeper
  nifti_patterns: ["*.nii", "*.nii.gz"]
  min_volumes_bold: 10        # files with fewer volumes are treated as non-BOLD (e.g. SBRef)
  mask_fraction_of_p98: 0.2   # crude in-brain mask for volume means: temporal mean > 0.2 x 98th percentile
  noise_frame_rel_threshold: 0.10   # trailing volumes with whole-volume mean < 10% of the run median
  nss_robust_z: 5.0           # leading volumes whose in-mask mean exceeds the median by > 5 robust SD
  nss_max_volumes: 20         # never call more than this many leading volumes non-steady-state
  dicom_max_folders: 10       # NIfTI folder + subfolders searched for DICOMs (series-numbered folder first)
  dicom_max_headers_per_folder: 400   # random sample of headers read per folder (MB/ME series hold 1e4+ files)
  json_fields:                # always reported, "absent" if missing
    - EchoTime
    - EchoNumber
    - SeriesNumber
    - SeriesDescription
    - ProtocolName
    - ImageType
    - RepetitionTime
    - MagneticFieldStrength
    - Manufacturer
    - ManufacturersModelName
    - SoftwareVersions
    - SequenceName
    - PulseSequenceDetails
    - MultibandAccelerationFactor
    - ParallelReductionFactorInPlane
    - ParallelAcquisitionTechnique
    - PartialFourier
    - PhaseEncodingDirection
    - PhaseEncodingAxis
    - InPlanePhaseEncodingDirectionDICOM
    - EffectiveEchoSpacing
    - TotalReadoutTime
    - BandwidthPerPixelPhaseEncode
    - PixelBandwidth
    - SliceThickness
    - SpacingBetweenSlices
    - FlipAngle
    - CoilCombinationMethod
    - ReceiveCoilName
    - ReceiveCoilActiveElements
    - CoilString
    - NumberOfVolumesDiscardedByScanner
    - NumberOfVolumesDiscardedByUser
    - ImageComments
  json_key_substrings: [Coil, Physio, Discard, Dummy, Multiband, MultiBand, Accel, Caipi, CAIPI, Shift]
  physio_patterns:            # case-insensitive filename patterns searched for physiological logs
    - "*physio*"
    - "*.puls"
    - "*.resp"
    - "*.ecg"
    - "*.ext"
    - "*_puls*.log"
    - "*_resp*.log"
    - "*_ecg*.log"
    - "*_info.log"
    - "*.acq"
  ascconv_keywords:          # Siemens protocol (ASCCONV) lines reported raw, for the user to interpret
    - MultiBand
    - SliceAccel
    - FOVShift
    - Caipi
    - sPat
    - PartialFourier
    - CoilCombine
    - lRepetitions
    - sSliceArray.lSize
    - dThickness
    - sWipMemBlock
    - ucReconstructionMode

  pipeline_keywords:          # lines of mbme_tedana.py reported verbatim (settings we must not guess)
    - interp
    - flirt
    - tedana
    - tedpca
    - ica-method
    - ica_method
    - robust
    - seed
    - fittype
    - mask
    - keep-intermediates
    - focal
    - argparse
    - add_argument
  pipeline_max_lines: 120

frontend:                     # Phase 2 (CLAUDE.md section 5.4); listed now so they are fixed in advance
  snr_min: 5.0
  snr_min_sensitivity: 3.0
  sigma_init_snr: 10.0
  mppca_sigma_tolerance: 0.20
  mask_source: pipeline        # proposed: <run>/brain_mask.nii.gz from mbme_tedana (same voxels as tedana); confirm at Phase 2
  nonpositive_policy: exclude_echo   # proposed: a voxel-echo with any frame <= 0 (spline undershoot) is unusable; confirm at Phase 2
